type: object
title: CivilizationListPage
description: A cursor-paginated page of public civilization projections.
required:
  - items
properties:
  items:
    type: array
    items:
      $ref: ./PublicProjection.yaml
  nextCursor:
    description: Cursor for the next page, or null when this is the last page.
    oneOf:
      - $ref: ../common/Cursor.yaml
      - type: "null"
