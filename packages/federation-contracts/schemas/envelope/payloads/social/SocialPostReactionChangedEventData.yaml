type: object
title: SocialPostReactionChangedEventData
description: Citizen-safe like/unlike state event; private authority metadata is excluded.
additionalProperties: false
required:
  - postId
  - accountId
  - liked
  - changedAt
properties:
  postId:
    type: string
    minLength: 1
    maxLength: 200
  accountId:
    type: string
    minLength: 1
    maxLength: 200
  liked:
    type: boolean
  changedAt:
    type: string
    format: date-time
