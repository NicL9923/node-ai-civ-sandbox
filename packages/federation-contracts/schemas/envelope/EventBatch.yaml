type: object
title: EventBatch
description: >-
  An at-least-once batch of civ-originated CloudEvents pushed to the World.
  Deduplicated per-event by the CloudEvents `idempotencykey` (falling back to
  `source` + `id`).
required:
  - events
properties:
  events:
    type: array
    minItems: 1
    maxItems: 500
    items:
      $ref: ./CloudEvent.yaml
