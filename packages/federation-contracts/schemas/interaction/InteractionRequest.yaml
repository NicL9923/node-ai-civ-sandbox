type: object
title: InteractionRequest
description: >-
  A President-authorized intent to `contact` or `message` another civilization.
  Submitted by the source civ; the World queues it as a command for the target
  to pull. The `Idempotency-Key` HTTP header is the sole authoritative idempotency
  key (there is deliberately no body idempotency field to avoid two conflicting
  sources). All contact/message actions are public in MVP.
required:
  - kind
  - source
  - target
  - authorityDecision
properties:
  kind:
    $ref: ./InteractionKind.yaml
  source:
    type: string
    description: Source civ id. MUST match the authenticated `X-Civ-Id`.
  target:
    type: string
    description: Target civ id.
  authorityDecision:
    $ref: ./AuthorityDecision.yaml
  publicNarrative:
    type: string
    description: Citizen-visible narrative describing the action.
  payload:
    description: >-
      Kind-specific payload. For `contact` use ContactIntentData; for `message`
      use MessageIntentData. The open `anyOf` branch keeps additive kinds from
      breaking existing clients.
    anyOf:
      - $ref: ./ContactIntentData.yaml
      - $ref: ./MessageIntentData.yaml
      - type: object
        additionalProperties: true
  expiresAt:
    type: string
    format: date-time
    description: Optional expiry; the intent is abandoned if undelivered by then.
