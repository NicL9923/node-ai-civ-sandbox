type: object
title: SocialAccountSyncRequest
description: >-
  Atomic idempotent upsert of 1-100 accounts owned by one authenticated civilization.
  Every actor.civId MUST equal this civId and X-Civ-Id. Natural account keys MUST be
  unique within the batch.
additionalProperties: false
required:
  - civId
  - accounts
properties:
  civId:
    type: string
    minLength: 1
    maxLength: 200
  accounts:
    type: array
    minItems: 1
    maxItems: 100
    uniqueItems: true
    contains:
      type: object
      properties:
        actor:
          type: object
          properties:
            kind:
              const: official
          required: [kind]
      required: [actor]
    minContains: 0
    maxContains: 1
    items:
      $ref: ./SocialAccountUpsert.yaml
