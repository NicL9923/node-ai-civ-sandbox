type: object
title: SocialAccountPage
description: Snapshot cursor page of public social accounts.
additionalProperties: false
required:
  - items
  - nextCursor
properties:
  items:
    type: array
    maxItems: 100
    items:
      $ref: ./SocialAccountSummary.yaml
  nextCursor:
    description: Opaque cursor for the next older page in the same immutable snapshot.
    oneOf:
      - $ref: ../common/Cursor.yaml
      - type: "null"
