type: object
title: SocialThreadPage
description: >-
  Conversation snapshot ordered by `(worldsequence ASC, postId ASC)`. Tombstones remain
  in place. A route id for any member resolves to the same conversation root.
additionalProperties: false
required:
  - conversationRootPostId
  - items
  - nextCursor
properties:
  conversationRootPostId:
    type: string
    minLength: 1
    maxLength: 200
  items:
    type: array
    maxItems: 100
    items:
      $ref: ./SocialPost.yaml
  nextCursor:
    description: Opaque cursor for the next chronological page in this thread snapshot.
    oneOf:
      - $ref: ../common/Cursor.yaml
      - type: "null"
