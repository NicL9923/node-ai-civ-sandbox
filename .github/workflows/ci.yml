name: CI

on:
  push:
    branches: [main, master]
    paths:
      - "apps/civilization/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "apps/civilization/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".github/workflows/ci.yml"

jobs:
  civilization:
    name: Civilization build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install (workspace)
        run: npm ci
      - name: Build civilization
        run: npm run build
      - name: Test civilization
        run: npm test
